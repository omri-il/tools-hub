<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מקצר קישורים מהיר</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="מקצר קישורים חינמי, הדביקו קישור ארוך וקבלו קישור קצר של TinyURL, מיד, בלי הרשמה." />
  <meta property="og:title" content="מקצר קישורים מהיר" />
  <meta property="og:locale" content="he_IL" />
  <link rel="stylesheet" href="../css/fonts.css?v=1" />
  <style>
    /* Business design language (approved 2026-11-15): light page, navy ink, white cards,
       ochre only on the one main button. Rubik for titles and labels, Assistant for text. */
    :root{
      --navy:#002045; --navy-hover:#1A365D; --ochre:#FFC250; --ochre-hover:#D69E2E;
      --bg:#F9F9FF; --card:#FFFFFF; --panel:#FFFFFF; --soft:#F0F3FF;
      --ink:#121C2C; --muted:#43474E; --faint:#5B6170;
      --line:#E3E6EF; --line-strong:#C4C6CF; --accent:#002045; --accent2:#1A365D;
      --bad:#BA1A1A; --ease:cubic-bezier(0.2,0,0,1);
      font-family:'Assistant',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);min-height:100vh;padding:34px 16px 70px;line-height:1.55;font-size:17px;-webkit-font-smoothing:antialiased}
    .wrap{max-width:640px;margin:0 auto}
    .back{display:inline-block;color:var(--navy);text-decoration:none;font-family:'Rubik',sans-serif;font-weight:500;font-size:.85rem;margin-bottom:18px}
    .back:hover{color:var(--navy-hover);text-decoration:underline;text-underline-offset:3px}
    .masthead{text-align:center;margin-bottom:30px}
    .kicker{font-family:'Rubik',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--faint)}
    h1{font-family:'Rubik',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,2.8rem);margin-top:10px;color:var(--navy);line-height:1.15}
    h1 .em{color:var(--navy);text-decoration:underline;text-decoration-color:var(--ochre);text-decoration-thickness:3px;text-underline-offset:.2em}
    .lede{color:var(--muted);font-weight:400;margin:14px auto 0;max-width:520px}
    .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 12px 28px -16px rgba(0,32,69,.28)}
    @media(max-width:480px){.sheet{padding:20px}}
    label{display:block;font-family:'Rubik',sans-serif;font-weight:600;font-size:.9rem;color:var(--navy);margin-bottom:7px}
    label span{font-family:'Assistant',sans-serif}
    input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;color:var(--ink);font-family:'Assistant',sans-serif;font-size:1rem;padding:13px 14px;direction:ltr;text-align:left;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
    input[type=text]::placeholder{color:var(--faint);opacity:1}
    input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,32,69,0.14)}
    .btn{font-family:'Rubik',sans-serif;font-weight:600;border:1.5px solid transparent;border-radius:12px;cursor:pointer;padding:12px 22px;font-size:.95rem;margin-top:14px;transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
    .btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
    .btn-primary{background:var(--ochre);color:var(--navy)}
    .btn-primary:hover{background:var(--ochre-hover)}
    .btn-ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
    .btn-ghost:hover{background:var(--soft);color:var(--navy-hover);border-color:var(--navy-hover)}
    .out{margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;display:none}
    .out.show{display:block}
    .out a{color:var(--navy);font-family:'Rubik',sans-serif;font-weight:700;font-size:1.1rem;text-decoration:none;direction:ltr;display:block;text-align:left;word-break:break-all}
    .out a:hover{color:var(--navy-hover);text-decoration:underline;text-underline-offset:3px}
    .msg{margin-top:12px;color:var(--faint);font-size:.9rem;min-height:1em}
    footer{margin-top:42px;color:var(--faint);font-size:.88rem;text-align:center;line-height:1.9}
    footer a{color:var(--navy)}
    footer a:hover{color:var(--navy-hover)}
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-family:'Rubik',sans-serif;font-weight:600;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:50}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">→ חזרה לכל הכלים</a>
    <div class="masthead">
      <div class="kicker">הכלים של עומרי אירם</div>
      <h1>מקצר קישורים <span class="em">מהיר</span></h1>
      <p class="lede">הדביקו קישור ארוך וקבלו קישור קצר של TinyURL, מיד, בלי הרשמה ובלי התקנה.</p>
    </div>

    <div class="sheet">
      <label for="url">הקישור הארוך</label>
      <input type="text" id="url" placeholder="https://example.com/very/long/link?with=params" />
      <label for="alias" style="margin-top:14px">כינוי אישי<span style="color:var(--faint);font-weight:400;font-size:.85rem">, אופציונלי (tinyurl.com/<span dir="ltr">הכינוי</span>)</span></label>
      <input type="text" id="alias" dir="ltr" placeholder="my-link" />
      <button class="btn btn-primary" id="go" type="button" style="margin-top:14px">קצר את הקישור</button>
      <div class="out" id="out"><a id="shortLink" href="#" target="_blank" rel="noopener"></a></div>
      <div class="msg" id="msg"></div>
      <button class="btn btn-ghost" id="copy" type="button" style="display:none">📋 העתק</button>
    </div>

    <footer>
      <p>הקיצור נוצר דרך TinyURL. רוצים קישור עם דומיין משלכם + מעקב? יש גם <a href="../">מקצר ממותג</a> (אדמין).</p>
      <p>מבית <a href="https://tools.omri-iram.co.il">הכלים של עומרי אירם</a></p>
    </footer>
  </div>

  <div class="toast" id="toast">הועתק</div>

  <script>
    const $=id=>document.getElementById(id);
    const API='https://go.omri-iram.co.il/api';
    let last='';
    async function shorten(){
      const url=$('url').value.trim(), msg=$('msg'), out=$('out');
      if(!/^https?:\/\//i.test(url)){ msg.textContent='הדביקו כתובת שמתחילה ב-http:// או https://'; out.classList.remove('show'); return; }
      msg.textContent='מקצר…'; out.classList.remove('show'); $('copy').style.display='none';
      try{
        const alias=$('alias').value.trim();
        const r=await fetch(API+'/tinyurl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(alias?{url,alias}:{url})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok||!j.short){ msg.textContent='שגיאה: '+(j.error||'הכינוי אולי תפוס, נסו אחר')+''; return; }
        last=j.short; const a=$('shortLink'); a.href=j.short; a.textContent=j.short;
        out.classList.add('show'); msg.textContent=''; $('copy').style.display='inline-block';
      }catch(e){ msg.textContent='שגיאת רשת, נסו שוב.'; }
    }
    $('go').addEventListener('click',shorten);
    $('url').addEventListener('keydown',e=>{ if(e.key==='Enter') shorten(); });
    $('copy').addEventListener('click',async()=>{
      if(!last)return;
      try{ await navigator.clipboard.writeText(last); }catch(_){ }
      const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500);
    });
  </script>
</body>
</html>
